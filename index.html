<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<title>VJCET Campus Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b33;--ink2:#4a5568;--line:#e3e7ee;--bg:#eceef1;--card:#fff;--you:#2563eb;--route:#e11d48;--go:#0b7a5a;--sh:0 6px 24px rgba(15,27,51,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font:500 15px/1.35 Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--you);outline-offset:2px}
#app{position:fixed;inset:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:var(--bg)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.btn{min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:#fff;border:1.5px solid var(--line)}
.btn.main{background:var(--you);border-color:var(--you);color:#fff}
.btn.stop{background:#fff;color:#b42318;border-color:#f3c1bc}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}

/* search card */
#top{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);padding:6px;display:flex;align-items:center;gap:4px}
#top .fields{flex:1;min-width:0}
.field{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 10px;border-radius:12px;text-align:left}
.field:active{background:#f2f4f8}
.field .pin{flex:none;width:12px;height:12px;border-radius:50%;border:3px solid var(--go)}
.field.to .pin{border-color:var(--route);background:var(--route)}
.field span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.field span.ph{color:#7b8496;font-weight:500}
.sep{height:1px;background:var(--line);margin:0 10px 0 34px}
#swap{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
#swap:active{background:#f2f4f8}

/* side controls */
#side{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 150px);display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.seg{display:flex;flex-direction:column;padding:4px;gap:2px}
.seg button{width:44px;height:44px;border-radius:12px;font-weight:800;font-size:16px;color:var(--ink2)}
.seg button.on{background:var(--ink);color:#fff}
#recenter{display:none;width:48px;height:48px;border-radius:50%;place-items:center}

/* route sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);border-radius:22px 22px 0 0;max-height:62dvh;display:none;flex-direction:column}
#sheet .big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
#sheet .big small{font-size:16px;font-weight:700;margin-left:4px;color:var(--ink2);letter-spacing:0}
#sheet .note{color:var(--ink2);font-size:13px;margin-top:6px}
#steps{overflow:auto;margin:10px -4px 0;padding:0 4px}
#steps .st{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
#steps .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
#steps small{color:var(--ink2)}
#sheet .acts{display:flex;gap:10px;margin-top:12px}
#sheet .acts .main{flex:1}
#dirs{margin-top:10px;text-align:left;color:var(--you);font-weight:700;min-height:36px}
.hint{color:var(--ink2);font-size:13px;margin-top:8px}

/* live banner and bar */
#nav{position:absolute;left:0;right:0;top:0;display:none;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;background:var(--ink);color:#fff;border-radius:0 0 22px 22px;box-shadow:var(--sh)}
#nav .row{display:flex;align-items:center;gap:16px}
#nav svg{flex:none;width:64px;height:64px}
#nav .h{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
#nav .s{font-size:17px;font-weight:700;color:#b7c4e4;margin-top:2px}
#nav .rest{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18);font-size:14px;color:#b7c4e4;display:flex;justify-content:space-between}
#bar{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);display:none;flex-direction:column;gap:10px}
#bar .r{display:flex;gap:10px}
#bar .r .btn{flex:1}
#bar .r .btn.i{flex:none;width:52px;padding:0;display:grid;place-items:center}
#stairs{display:none;min-height:56px;font-size:17px}
#off{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 150px);display:none;padding:14px}
#off b{display:block;margin-bottom:10px}
#off .r{display:flex;gap:10px}#off .r .btn{flex:1}

/* overlays */
#search{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:20}
#search .hd{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 10px) 10px 10px;background:#fff;border-bottom:1px solid var(--line)}
#search .hd button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
#q{flex:1;min-width:0;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;background:#f7f8fa}
#chips{display:flex;gap:8px;padding:10px;flex-wrap:wrap}
#chips:empty{display:none}
#chips button{min-height:40px;padding:0 14px;border-radius:20px;background:#fff;border:1.5px solid var(--line);font-weight:700}
#chips button[disabled]{opacity:.45}
#res{flex:1;overflow:auto;background:#fff}
#res button{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);min-height:56px}
#res button:active{background:#f2f4f8}
#res b{display:block}
#res small{color:var(--ink2)}
#res .empty{padding:24px 16px;color:var(--ink2)}
#tools{position:absolute;left:0;right:0;bottom:0;z-index:15;display:none;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);border-radius:22px 22px 0 0}
#tools p{margin:6px 0 12px;color:var(--ink2);font-size:13px;line-height:1.5}
#tools .r{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
#tools .r .btn{flex:1;min-width:130px}
#tools label{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700}
#tools input[type=range]{flex:1}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 24px);max-width:calc(100% - 32px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;display:none;z-index:30;text-align:center}

#hint0{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 14px);padding:14px 16px;color:var(--ink2);font-size:14px;display:none}
#app[data-mode=browse] #hint0{display:block}
#app[data-mode=preview] #sheet{display:flex}
#app[data-mode=live] #top,#app[data-mode=live] #sheet{display:none}
#app[data-mode=live] #nav{display:block}
#app[data-mode=live] #bar{display:flex}
#app[data-mode=live] #side{top:calc(env(safe-area-inset-top) + 190px)}
@media(prefers-reduced-motion:no-preference){#sheet,#nav{animation:up .25s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="app" data-mode="browse">
<svg id="map" preserveAspectRatio="xMidYMid slice"><image id="img"/><g id="ov"></g></svg>

<div id="top" class="card">
 <div class="fields">
  <button class="field from" id="fromBtn"><span class="pin"></span><span class="t ph" id="fromTxt">Start: where are you?</span></button>
  <div class="sep"></div>
  <button class="field to" id="toBtn"><span class="pin"></span><span class="t ph" id="toTxt">Destination</span></button>
 </div>
 <button id="swap" aria-label="Swap start and destination"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"/></svg></button>
</div>

<div id="side">
 <div class="card seg" id="blocks" role="group" aria-label="Block"></div>
 <div class="card seg" id="floors" role="group" aria-label="Floor"></div>
 <button id="recenter" class="card" aria-label="Centre on me"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</div>

<div id="hint0" class="card">Pick a start and a destination above. Pinch to zoom the map, and use the buttons on the right to change block or floor.</div>

<div id="sheet" class="card">
 <div><div class="big" id="total"></div><div class="note" id="est"></div></div>
 <button id="dirs">Show directions</button>
 <div id="steps" style="display:none"></div>
 <div class="acts"><button class="btn" id="clr">Clear</button><button class="btn main" id="go">Start walking</button></div>
 <div class="hint">Stand at the door of the start room, hold your phone upright and walk along the corridor.</div>
</div>

<div id="nav">
 <div class="row"><div id="icon"></div><div><div class="h" id="nh"></div><div class="s" id="ns"></div></div></div>
 <div class="rest"><span id="nr"></span><span id="nq"></span></div>
</div>

<div id="off" class="card"><b>You may be off route.</b><div class="r"><button class="btn main" id="offFix">Choose where I am</button><button class="btn" id="offOk">I'm on route</button></div></div>

<div id="bar">
 <button class="btn main" id="stairs"></button>
 <div class="r">
  <button class="btn i card" id="toolsBtn" aria-label="Sensor tools"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  <button class="btn card" id="where">Where am I?</button>
  <button class="btn stop card" id="stop">Stop</button>
 </div>
</div>

<div id="tools" class="card">
 <b>Sensor tools</b>
 <p id="stats"></p>
 <label>Step sensitivity <input type="range" id="lth" min="0.4" max="3" step="0.1" value="1.2"><span id="lthv">1.2</span></label>
 <div class="r"><button class="btn" id="lset">Set direction</button><button class="btn" id="lstep">Add a step</button><button class="btn" id="llog">Download log</button><button class="btn dark" id="tclose">Close</button></div>
</div>

<div id="search">
 <div class="hd"><button id="sback" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><input id="q" type="search" placeholder="Room number, name or place" autocomplete="off" enterkeyhint="search"></div>
 <div id="chips"></div>
 <div id="res"></div>
</div>
<div id="toast" role="status"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const app=$('app'),svg=$('map'),img=$('img'),ov=$('ov');
const rad=Math.PI/180,ad=(a,b)=>((a-b)%360+540)%360-180,nrm=a=>((a%360)+360)%360;
let G,N={},cur,vb=[0,0,1,1],route=null,P=null,from=null,to=null,places=[],L={on:false},searchCb=null;
const fl=id=>G.floors.find(f=>f.id===id);
const flab=id=>{const f=fl(id);return f.block+' Block, '+f.label.toLowerCase()};
const FS={G:'G',RG:'R','1':'1','2':'2','3':'3'};

const ICON={
 straight:'<path d="M24 41V9M12 21L24 9L36 21"/>',
 left:'<path d="M35 41V28Q35 19 26 19H11M19 10L10 19L19 28"/>',
 right:'<path d="M13 41V28Q13 19 22 19H37M29 10L38 19L29 28"/>',
 stairs:'<path d="M7 40H17V30H27V20H37V10M30 8L38 10L40 18"/>',
 arrive:'<path d="M13 42V7M13 9H37L30 17L37 25H13"/>'
};
const icon=k=>`<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

function toast(t,ms=4500){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}

fetch('data/graph.json').then(r=>r.json()).then(g=>{
 G=g;g.nodes.forEach(n=>N[n.id]=n);
 places=g.nodes.filter(n=>!['passage','stairs','connector'].includes(n.type)).map(n=>({id:n.id,name:n.name,sub:flab(n.floor),hay:(n.name+' '+flab(n.floor)).toLowerCase()}))
  .sort((a,b)=>a.name.localeCompare(b.name));
 $('blocks').innerHTML=[...new Set(g.floors.map(f=>f.block))].map(b=>`<button data-b="${b}" aria-label="${b} Block">${b}</button>`).join('');
 const q=new URLSearchParams(location.search);
 setFloor(g.floors.find(f=>f.block==='C')?.id||g.floors[0].id);
 if(q.get('from')&&N[q.get('from')])from=q.get('from');
 if(q.get('to')&&N[q.get('to')])to=q.get('to');
 fields();if(from&&to)showRoute();
});

function fit(){const f=fl(cur),cw=svg.clientWidth||360,ch=svg.clientHeight||640;const w=Math.min(Math.max(f.w,f.h*cw/ch),Math.max(f.h*cw/ch,900));vb=[f.w/2-w/2,f.h/2-w*ch/cw/2,w,w*ch/cw]}
function setFloor(id,keepView){
 cur=id;const f=fl(id);img.setAttribute('href',f.image);img.setAttribute('width',f.w);img.setAttribute('height',f.h);
 if(!keepView)fit();
 const blk=f.block;
 $('floors').innerHTML=G.floors.filter(x=>x.block===blk).map(x=>`<button data-f="${x.id}" class="${x.id===id?'on':''}" aria-label="${x.label}">${FS[x.id.split('_')[1]]||x.label}</button>`).join('');
 document.querySelectorAll('#blocks button').forEach(b=>b.classList.toggle('on',b.dataset.b===blk));
 render();
}
$('blocks').onclick=e=>{const b=e.target.dataset.b;if(b){setFloor(G.floors.find(f=>f.block===b).id);userMoved()}};
$('floors').onclick=e=>{if(e.target.dataset.f){setFloor(e.target.dataset.f);userMoved()}};
const userMoved=()=>{if(L.on){L.follow=false;$('recenter').style.display='grid'}};
$('recenter').onclick=()=>{if(L.on&&L.pos){L.follow=true;$('recenter').style.display='none';if(L.pos.floor!==cur)setFloor(L.pos.floor);liveCenter(L.pos,true);render()}};

function fields(){
 const set=(id,t,ph)=>{const e=$(id);e.textContent=t||ph;e.classList.toggle('ph',!t)};
 set('fromTxt',from&&N[from].name,'Start: where are you?');
 set('toTxt',to&&N[to].name,'Destination');
}
$('fromBtn').onclick=()=>openSearch('from');
$('toBtn').onclick=()=>openSearch('to');
$('swap').onclick=()=>{[from,to]=[to,from];fields();if(from&&to)showRoute()};

/* search */
function results(q){
 const w=q.toLowerCase().split(/\s+/).filter(Boolean);
 if(!w.length)return[];
 return places.filter(p=>w.every(x=>p.hay.includes(x))).sort((a,b)=>(b.hay.startsWith(w[0])-a.hay.startsWith(w[0]))||a.name.localeCompare(b.name)).slice(0,60);
}
function drawResults(){
 const q=$('q').value,r=results(q);
 $('res').innerHTML=r.length?r.map(p=>`<button data-id="${p.id}"><b>${p.name}</b><small>${p.sub}</small></button>`).join(''):`<div class="empty">${q.trim()?'No place matches "'+q.replace(/</g,'&lt;')+'". Try part of the room number or name.':'Type a room number, name or place.'}</div>`;
}
function openSearch(which,cb){
 searchCb=cb||(id=>{if(which==='from')from=id;else to=id;fields();if(from&&to)showRoute();else if(which==='from'&&!to)toast('Now choose a destination.')});
 $('search').style.display='flex';$('q').value='';
 $('q').placeholder=which==='to'?'Where do you want to go?':'Where are you now?';
 $('chips').innerHTML=which==='to'?'<button id="nearT">Nearest toilet</button>':'';
 if(which==='to'&&!from)$('nearT').disabled=true;
 drawResults();setTimeout(()=>$('q').focus(),50);
}
function closeSearch(){$('search').style.display='none';$('q').blur()}
$('q').oninput=drawResults;
$('sback').onclick=closeSearch;
$('res').onclick=e=>{const b=e.target.closest('button');if(!b)return;const cb=searchCb;closeSearch();cb(b.dataset.id)};
$('chips').onclick=e=>{
 if(e.target.id!=='nearT'||!from)return;
 const d=dist(from);let best=null;
 G.nodes.filter(n=>n.type==='toilet'&&d[n.id]<1e11).forEach(n=>{if(!best||d[n.id]<d[best])best=n.id});
 if(!best){toast('No toilet is connected to your start yet.');return}
 closeSearch();to=best;fields();showRoute();
};

/* routing */
function graph(){
 const adj={};G.nodes.forEach(n=>adj[n.id]=[]);
 G.edges.forEach((e,i)=>{const A=N[e.a],B=N[e.b],w=e.w??Math.hypot(A.x-B.x,A.y-B.y)*(fl(A.floor).scale||1);adj[e.a].push([e.b,w,i]);adj[e.b].push([e.a,w,i])});
 return adj;
}
function dijkstra(a,b){
 const adj=graph(),d={},pv={},q=new Set(Object.keys(adj));
 q.forEach(k=>d[k]=1e12);d[a]=0;
 while(q.size){let u=null;q.forEach(k=>{if(u===null||d[k]<d[u])u=k});q.delete(u);if(u===b||d[u]>=1e12)break;adj[u].forEach(x=>{if(d[u]+x[1]<d[x[0]]){d[x[0]]=d[u]+x[1];pv[x[0]]=[u,x[2]]}})}
 return{d,pv};
}
const dist=a=>dijkstra(a,null).d;
function findRoute(a,b){
 const{d,pv}=dijkstra(a,b);if(d[b]>=1e12)return null;
 const nodes=[b],edges=[];let c=b;while(c!==a){const p=pv[c];edges.push(p[1]);c=p[0];nodes.unshift(c)}
 return{nodes,edges:edges.reverse(),len:d[b]};
}

function buildPlan(){
 const ids=route.nodes,segs=[];let cum=0;
 for(let k=1;k<ids.length;k++){
  const a=N[ids[k-1]],b=N[ids[k]],e=G.edges[route.edges[k-1]],fa=fl(a.floor),fb=fl(b.floor);
  const len=Math.hypot(a.x-b.x,a.y-b.y);
  const kind=a.floor===b.floor?'walk':(fa.block===fb.block?'stairs':'link');
  const steps=kind==='stairs'?0:(e.w??len*(fa.scale||1));
  const ang=kind==='walk'&&steps>0.5&&len>3?nrm(Math.atan2(b.x-a.x,-(b.y-a.y))/rad):null;
  segs.push({a,b,kind,steps,start:cum,ang,to:fb,from:fa,sw:kind==='stairs'?(e.w??26):0});
  cum+=steps;
 }
 const corners=[],events=[];let pv=null;
 segs.forEach(g=>{
  if(g.kind==='stairs')events.push({type:'stairs',pos:g.start,seg:g});
  if(g.kind==='link')events.push({type:'link',pos:g.start,seg:g});
  if(g.kind!=='walk'){pv=null;return}
  if(g.ang===null)return;
  if(pv&&Math.abs(ad(g.ang,pv.ang))>35){const c={type:'turn',pos:g.start,turn:ad(g.ang,pv.ang),out:g.ang,node:g.a};corners.push(c);events.push(c)}
  pv=g;
 });
 events.push({type:'end',pos:cum});
 events.sort((a,b)=>a.pos-b.pos);
 P={segs,corners,events,total:cum};
}

function showRoute(){
 if(!from||!to)return;
 if(from===to){toast('Choose two different places.');return}
 const r=findRoute(from,to);
 if(!r){route=null;P=null;app.dataset.mode='browse';render();toast('No walkable route between these two places yet.');return}
 route=r;buildPlan();
 const est=r.edges.some(i=>G.edges[i].est)||r.nodes.some(i=>fl(N[i].floor).est);
 $('total').innerHTML=(est?'About ':'')+Math.round(r.len)+'<small>steps</small>';
 $('est').textContent=est?'Approximate. Only C Block is measured so far.':'';
 $('steps').innerHTML=routeSteps().map((x,i)=>`<div class="st" data-f="${x.f}"><span class="n">${i+1}</span><span>${x.t}<br><small>${flab(x.f)}</small></span></div>`).join('');
 $('steps').style.display='none';$('dirs').textContent='Show directions';
 app.dataset.mode='preview';
 setFloor(N[from].floor);
 fitRoute();render();
}
function routeSteps(){
 const s=route.nodes,out=[{t:'Start at '+N[s[0]].name,f:N[s[0]].floor}];
 for(let k=1;k<s.length;k++){const a=N[s[k-1]],b=N[s[k]];if(a.floor!==b.floor){
  const fa=fl(a.floor),fb=fl(b.floor);
  out.push({t:fa.block!==fb.block?'Go from '+fa.block+' Block to '+fb.block+' Block':'Take the stairs to the '+fb.label.toLowerCase(),f:a.floor})}}
 out.push({t:'Arrive at '+N[s[s.length-1]].name,f:N[s[s.length-1]].floor});
 return out;
}
function fitRoute(){
 const pts=route.nodes.map(i=>N[i]).filter(n=>n.floor===cur);if(!pts.length)return;
 const x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)),y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));

function compass(alpha,beta,gamma){

}
const segAt=s=>P.segs.find(g=>g.ang!==null&&s>=g.start-1e-6&&s<=g.start+g.steps+1e-6);
function liveCap(){const g=P.segs.find(g=>g.kind==='stairs'&&!L.cleared.has(g));return g?g.start:P.total}
function livePos(){
 const first=P.segs[0].a;
 if(L.s<1e-6)return{floor:first.floor,x:first.x,y:first.y};
 let node=first;
 for(const g of P.segs){
  if(g.kind==='stairs'){if(L.cleared.has(g)){node=g.b;continue}break}
  if(g.steps<=0){if(L.s>g.start+1e-6||L.s>=P.total-1e-6)node=g.b;continue}
  if(L.s>=g.start+g.steps-1e-6){node=g.b;continue}
  const t=(L.s-g.start)/g.steps;
  if(g.kind==='walk')return{floor:g.a.floor,x:g.a.x+(g.b.x-g.a.x)*t,y:g.a.y+(g.b.y-g.a.y)*t};
  const n=t<.5?g.a:g.b;return{floor:n.floor,x:n.x,y:n.y};

}
function liveLog(ev,t){if(L.log.length>60000)return;L.log.push([Math.round(t-L.t0),...L.raw,L.gy.toFixed(0),...L.ori,L.hs===null?'':L.hs.toFixed(1),(L.lp-L.g).toFixed(2),ev])}

async function liveStart(){

function liveStop(){

function onMotion(ev){

function snapTurn(d){
